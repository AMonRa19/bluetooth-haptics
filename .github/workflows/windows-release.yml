name: Windows Release

on:
  push:
    branches:
      - bluetooth-haptics
    tags:
      - "v*-bt*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v1.3.1-bt.1)"
        required: false
        default: "v1.3.1-bt.1"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-exe]')) }}
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "hidapi>=0.15.0" "PySide6>=6.6.0" "numpy>=1.26.0" "sounddevice>=0.4.6" "pyinstaller>=6.0"

      - name: Compile sources and run tests
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $tag = "$env:GITHUB_REF_NAME"
          } elseif ("$env:GITHUB_EVENT_NAME" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $version = python -c "from version import __version__; print(__version__)"
            $tag = "v$version"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+-bt\.\d+$') {
            throw "Unexpected release tag '$tag'. Expected vMAJOR.MINOR.PATCH-bt.NUMBER."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HorizonHaptics-Bluetooth --collect-all sounddevice --collect-all _sounddevice_data --hidden-import hid main.py
          if (-not (Test-Path "dist/HorizonHaptics-Bluetooth.exe")) {
            throw "PyInstaller did not produce the expected executable."
          }

      - name: Prepare portable release ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path "release-package" | Out-Null
          Copy-Item "dist/HorizonHaptics-Bluetooth.exe" "release-package/"
          Copy-Item "README.md" "release-package/"
          Copy-Item "LICENSE" "release-package/"
          $zipName = "HorizonHaptics-Bluetooth-$env:RELEASE_TAG-win64.zip"
          Compress-Archive -Path "release-package/*" -DestinationPath $zipName -CompressionLevel Optimal
          if (-not (Test-Path $zipName)) {
            throw "Portable release ZIP was not created."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HorizonHaptics Bluetooth ${{ steps.release.outputs.tag }}
          body: |
            Windows x64 preview build of HorizonHaptics with native DualSense Bluetooth PCM haptics.

            - Includes the standalone executable and portable ZIP.
            - Steam Input is not disabled by this build.
            - Real-controller Bluetooth haptics validation is still pending; please treat this as a test preview.
          prerelease: true
          make_latest: false
          files: |
            dist/HorizonHaptics-Bluetooth.exe
            HorizonHaptics-Bluetooth-${{ steps.release.outputs.tag }}-win64.zip
          fail_on_unmatched_files: true
